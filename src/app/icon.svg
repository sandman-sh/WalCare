<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="walcare-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="45%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="walcare-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6" />
    </linearGradient>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect width="128" height="128" rx="30" fill="#12151E" />
  <rect width="124" height="124" x="2" y="2" rx="28" fill="none" stroke="url(#walcare-icon-grad)" stroke-width="2" opacity="0.7" />

  <!-- Soft Hologram Shield Backing -->
  <path d="M 64 22 C 86 22, 98 32, 98 48 C 98 76, 64 106, 64 106 C 64 106, 30 76, 30 48 C 30 32, 42 22, 64 22 Z" 
        fill="url(#walcare-icon-grad)" opacity="0.18" />

  <!-- Medical Cross Geometry -->
  <g filter="url(#icon-shadow)">
    <!-- Vertical Cross Stem -->
    <rect x="56" y="32" width="16" height="64" rx="8" fill="url(#walcare-icon-grad)" opacity="0.4" />
    <!-- Horizontal Cross Stem -->
    <rect x="32" y="56" width="64" height="16" rx="8" fill="url(#walcare-icon-grad)" opacity="0.4" />

    <!-- Sharp Dynamic ECG Waveform -->
    <path d="M 28 64 L 44 64 L 52 42 L 60 86 L 70 34 L 78 74 L 84 64 L 100 64" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse Peak Marker Dot -->
    <circle cx="70" cy="34" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>
